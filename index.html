<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="author" content="科波菲尔">
    <meta name="description" content="David Copperfield 的个人站点 — 闪击战ID大百科、法语学习、WOTB日志工具">
    <title>科波菲尔的个人站点</title>
    <link rel="shortcut icon" type="image/x-icon" href="/wotb-id/favicon.ico">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1117;
            --surface: #181b24;
            --surface-hover: #1f2331;
            --border: #2a2e3d;
            --text: #e2e5f0;
            --text-dim: #8b90a5;
            --accent-1: #f59e0b;
            --accent-2: #3b82f6;
            --accent-3: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .header h1 .name {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 960px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.75rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 14px 14px 0 0;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: #3d4260;
            transform: translateY(-3px);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:nth-child(1)::before { background: linear-gradient(90deg, var(--accent-1), transparent); }
        .card:nth-child(2)::before { background: linear-gradient(90deg, var(--accent-2), transparent); }
        .card:nth-child(3)::before { background: linear-gradient(90deg, var(--accent-3), transparent); }

        .card .icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .card:nth-child(1) .icon { background: rgba(245, 158, 11, 0.12); }
        .card:nth-child(2) .icon { background: rgba(59, 130, 246, 0.12); }
        .card:nth-child(3) .icon { background: rgba(16, 185, 129, 0.12); }

        .card .icon svg {
            width: 24px;
            height: 24px;
        }

        .card:nth-child(1) .icon svg { color: var(--accent-1); }
        .card:nth-child(2) .icon svg { color: var(--accent-2); }
        .card:nth-child(3) .icon svg { color: var(--accent-3); }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .card .desc {
            color: var(--text-dim);
            font-size: 0.88rem;
            flex: 1;
        }

        .card .tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.2em 0.6em;
            border-radius: 4px;
            width: fit-content;
        }

        .card:nth-child(1) .tag { background: rgba(245, 158, 11, 0.12); color: var(--accent-1); }
        .card:nth-child(2) .tag { background: rgba(59, 130, 246, 0.12); color: var(--accent-2); }
        .card:nth-child(3) .tag { background: rgba(16, 185, 129, 0.12); color: var(--accent-3); }

        .card .cta {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-dim);
            transition: color 0.2s;
        }

        .card:hover .cta {
            color: var(--text);
        }

        /* 建设中状态 */
        .card.wip {
            border-style: dashed;
            border-color: var(--border);
        }

        .card.wip::after {
            content: "建设中";
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.15em 0.55em;
        }

        .card.wip .icon,
        .card.wip h2,
        .card.wip .desc,
        .card.wip .tag {
            opacity: 0.5;
        }

        .card.wip .cta {
            opacity: 0.5;
        }

        .card.wip:hover {
            background: var(--surface);
            border-color: var(--border);
            transform: none;
        }

        .card .cta svg {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
        }

        .card:hover .cta svg {
            transform: translateX(3px);
        }

        .footer {
            margin-top: 3rem;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-align: center;
        }

        .footer a {
            color: var(--text-dim);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            transition: color 0.2s, border-color 0.2s;
        }

        .footer a:hover {
            color: var(--text);
            border-color: var(--text);
        }

        /* 法语站点的相对路径链接修正 */
        .card-fr h2::after {
            content: "";
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="footer">

</html>
